<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>Introduction to JavaScript and DOM Manipulation</h1>
        <p>This is a simple HTML document to demonstrate JavaScript and DOM manipulation.</p>

        <p id="textToChange">This text will change when you click the button.</p>
        <button class="changeTxtBtn" style="display: flex; justify-content: center; flex-direction: row;">Change Text</button>
    </div>

    <script>
        document.querySelector('.changeTxtBtn').addEventListener('click', function() {
             document.getElementById('textToChange').innerText = 'The text has been changed!';
             let colorchange = document.querySelector('#textToChange');
             colorchange.style.backgroundColor = 'yellow';
             colorchange.style.color = 'red';
        });
    </script>
</body>
</html>
